<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Network anomaly detection model pipeline</title>
  <desc id="desc">A model comparison architecture diagram showing baselines, classical machine learning, deep sequence models, and graph-temporal detectors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse"><stop stop-color="#020617"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10B981"/><stop offset="1" stop-color="#38BDF8"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F97316"/><stop offset="1" stop-color="#F43F5E"/></linearGradient>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <text x="60" y="72" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">Model comparison pipeline</text>
  <text x="62" y="104" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Same dataset, same chronological split, same evaluation protocol — different detector families.</text>

  <g transform="translate(62 160)">
    <rect width="250" height="300" rx="26" fill="#0F172A" stroke="#334155"/>
    <rect x="24" y="24" width="202" height="58" rx="18" fill="url(#a)" opacity="0.22"/>
    <text x="34" y="60" fill="#E0F2FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Telemetry windows</text>
    <text x="28" y="118" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Host features</text>
    <text x="28" y="150" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Protocol counters</text>
    <text x="28" y="182" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Temporal sequences</text>
    <text x="28" y="214" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Correlation graph</text>
    <path d="M28 250H222" stroke="#334155"/>
    <text x="28" y="278" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Input is split chronologically.</text>
  </g>

  <path d="M330 310H404" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M390 296L410 310L390 324" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(420 138)">
    <rect width="300" height="92" rx="20" fill="#0F172A" stroke="#334155"/>
    <circle cx="40" cy="46" r="18" fill="#38BDF8" opacity="0.25"/>
    <text x="74" y="40" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800">Statistical baselines</text>
    <text x="74" y="63" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Z-score · rolling median/MAD</text>
  </g>
  <g transform="translate(420 254)">
    <rect width="300" height="92" rx="20" fill="#0F172A" stroke="#334155"/>
    <circle cx="40" cy="46" r="18" fill="#10B981" opacity="0.25"/>
    <text x="74" y="40" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800">Classical ML</text>
    <text x="74" y="63" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Isolation Forest</text>
  </g>
  <g transform="translate(420 370)">
    <rect width="300" height="92" rx="20" fill="#0F172A" stroke="#334155"/>
    <circle cx="40" cy="46" r="18" fill="#8B5CF6" opacity="0.25"/>
    <text x="74" y="40" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800">Deep sequence models</text>
    <text x="74" y="63" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">LSTM AE · Transformer AE</text>
  </g>
  <g transform="translate(420 486)">
    <rect width="300" height="92" rx="20" fill="#0F172A" stroke="#334155"/>
    <circle cx="40" cy="46" r="18" fill="#F97316" opacity="0.25"/>
    <text x="74" y="40" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800">Graph-temporal model</text>
    <text x="74" y="63" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Host relation-aware AE</text>
  </g>

  <path d="M738 310H812" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <path d="M798 296L818 310L798 324" stroke="#475569" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(838 160)">
    <rect width="300" height="300" rx="26" fill="#0F172A" stroke="#334155"/>
    <rect x="24" y="24" width="252" height="58" rx="18" fill="url(#c)" opacity="0.22"/>
    <text x="40" y="60" fill="#FED7AA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800">Unified evaluation</text>
    <text x="34" y="118" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Anomaly score export</text>
    <text x="34" y="150" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Validation threshold</text>
    <text x="34" y="182" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Held-out metrics</text>
    <text x="34" y="214" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">ROC / PR curves</text>
    <text x="34" y="246" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Detection delay</text>
    <path d="M34 266H266" stroke="#334155"/>
    <text x="34" y="292" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Same evaluation design across models.</text>
  </g>
</svg>
