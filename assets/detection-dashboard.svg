<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Network anomaly detection dashboard preview</title>
  <desc id="desc">A conceptual dashboard showing anomaly scores, model comparison cards, host risk ranking, and detection alerts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="60" y1="160" x2="720" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <circle cx="1050" cy="95" r="220" fill="#38BDF8" opacity="0.07"/>
  <circle cx="120" cy="650" r="260" fill="#8B5CF6" opacity="0.08"/>

  <text x="58" y="72" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">Network Anomaly Detection Command View</text>
  <text x="60" y="105" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Synthetic multi-host telemetry · validation thresholding · repeated-seed model comparison</text>

  <g transform="translate(58 135)">
    <rect width="252" height="110" rx="22" fill="url(#card)" stroke="#334155"/>
    <text x="24" y="38" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Best F1-score</text>
    <text x="24" y="78" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800">0.91</text>
    <text x="135" y="77" fill="#22C55E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">graph-temporal AE</text>
  </g>
  <g transform="translate(330 135)">
    <rect width="252" height="110" rx="22" fill="url(#card)" stroke="#334155"/>
    <text x="24" y="38" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">False-positive rate</text>
    <text x="24" y="78" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800">2.4%</text>
    <text x="145" y="77" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">validation tuned</text>
  </g>
  <g transform="translate(602 135)">
    <rect width="252" height="110" rx="22" fill="url(#card)" stroke="#334155"/>
    <text x="24" y="38" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Detection delay</text>
    <text x="24" y="78" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800">4.8</text>
    <text x="116" y="77" fill="#F97316" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">windows avg.</text>
  </g>
  <g transform="translate(874 135)">
    <rect width="268" height="110" rx="22" fill="url(#card)" stroke="#334155"/>
    <text x="24" y="38" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Missed anomaly runs</text>
    <text x="24" y="78" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800">1</text>
    <text x="78" y="77" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">held-out period</text>
  </g>

  <g transform="translate(58 275)">
    <rect width="690" height="310" rx="24" fill="url(#card)" stroke="#334155"/>
    <text x="28" y="42" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">Anomaly score timeline</text>
    <text x="28" y="68" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Scores are evaluated against a validation-selected threshold.</text>
    <path d="M50 230H640" stroke="#334155"/>
    <path d="M50 175H640" stroke="#334155" opacity="0.7"/>
    <path d="M50 120H640" stroke="#334155" opacity="0.7"/>
    <path d="M50 90H640" stroke="#F97316" stroke-dasharray="9 8" opacity="0.9"/>
    <text x="540" y="84" fill="#F97316" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">threshold</text>
    <path d="M54 222C82 208 110 219 138 205C166 192 197 219 224 211C252 203 275 176 304 187C334 198 365 196 392 157C420 116 453 89 485 115C514 139 536 64 570 80C599 94 615 166 638 138" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <rect x="385" y="100" width="32" height="128" rx="8" fill="#F97316" opacity="0.18"/>
    <rect x="548" y="70" width="42" height="158" rx="8" fill="#F97316" opacity="0.18"/>
    <circle cx="453" cy="89" r="8" fill="#F97316"/>
    <circle cx="570" cy="80" r="8" fill="#F97316"/>
  </g>

  <g transform="translate(780 275)">
    <rect width="362" height="310" rx="24" fill="url(#card)" stroke="#334155"/>
    <text x="26" y="42" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800">Model leaderboard</text>
    <text x="26" y="68" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Example concept metrics for README preview.</text>
    <g transform="translate(26 98)">
      <text x="0" y="16" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Graph-temporal AE</text>
      <rect x="0" y="28" width="300" height="12" rx="6" fill="#1E293B"/>
      <rect x="0" y="28" width="273" height="12" rx="6" fill="#22C55E"/>
      <text x="312" y="39" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">.91</text>
    </g>
    <g transform="translate(26 148)">
      <text x="0" y="16" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Transformer AE</text>
      <rect x="0" y="28" width="300" height="12" rx="6" fill="#1E293B"/>
      <rect x="0" y="28" width="246" height="12" rx="6" fill="#38BDF8"/>
      <text x="312" y="39" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">.82</text>
    </g>
    <g transform="translate(26 198)">
      <text x="0" y="16" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">LSTM AE</text>
      <rect x="0" y="28" width="300" height="12" rx="6" fill="#1E293B"/>
      <rect x="0" y="28" width="225" height="12" rx="6" fill="#8B5CF6"/>
      <text x="312" y="39" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">.75</text>
    </g>
    <g transform="translate(26 248)">
      <text x="0" y="16" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Rolling MAD</text>
      <rect x="0" y="28" width="300" height="12" rx="6" fill="#1E293B"/>
      <rect x="0" y="28" width="204" height="12" rx="6" fill="#F97316"/>
      <text x="312" y="39" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">.68</text>
    </g>
  </g>

  <g transform="translate(58 615)">
    <rect width="1084" height="62" rx="18" fill="#0F172A" stroke="#334155"/>
    <circle cx="32" cy="31" r="11" fill="#22C55E"/>
    <text x="56" y="28" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Research integrity mode</text>
    <text x="56" y="48" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Normal-only preprocessing · validation thresholding · chronological holdout · no test-period tuning</text>
  </g>
</svg>
