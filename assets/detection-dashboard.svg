<svg width="1400" height="860" viewBox="0 0 1400 860" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Network anomaly detection dashboard</title>
  <desc id="desc">Professional dashboard visual with aligned metric cards, anomaly score chart, detector comparison, host risk ranking, and alert review queue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="score" x1="120" y1="320" x2="910" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8"/><stop offset="0.55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F97316"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/></filter>
  </defs>

  <rect width="1400" height="860" rx="34" fill="url(#bg)"/>
  <circle cx="1160" cy="130" r="260" fill="#38BDF8" opacity="0.06"/>
  <circle cx="1240" cy="770" r="260" fill="#8B5CF6" opacity="0.06"/>

  <g transform="translate(60 48)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="38" fill="#F8FAFC" font-size="36" font-weight="900">Network Anomaly Detection Dashboard</text>
    <text x="2" y="72" fill="#94A3B8" font-size="18">held-out test evaluation · threshold review · detector comparison · operational alert evidence</text>
  </g>

  <g transform="translate(60 138)" font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g>
      <rect width="292" height="118" rx="24" fill="url(#card)" stroke="#334155"/>
      <circle cx="38" cy="44" r="18" fill="#38BDF8" opacity="0.22"/><circle cx="38" cy="44" r="7" fill="#38BDF8"/>
      <text x="70" y="43" fill="#94A3B8" font-size="15" font-weight="800">Precision</text>
      <text x="70" y="82" fill="#F8FAFC" font-size="36" font-weight="900">0.91</text>
    </g>
    <g transform="translate(322 0)">
      <rect width="292" height="118" rx="24" fill="url(#card)" stroke="#334155"/>
      <circle cx="38" cy="44" r="18" fill="#10B981" opacity="0.22"/><circle cx="38" cy="44" r="7" fill="#10B981"/>
      <text x="70" y="43" fill="#94A3B8" font-size="15" font-weight="800">Recall</text>
      <text x="70" y="82" fill="#F8FAFC" font-size="36" font-weight="900">0.88</text>
    </g>
    <g transform="translate(644 0)">
      <rect width="292" height="118" rx="24" fill="url(#card)" stroke="#334155"/>
      <circle cx="38" cy="44" r="18" fill="#8B5CF6" opacity="0.22"/><circle cx="38" cy="44" r="7" fill="#8B5CF6"/>
      <text x="70" y="43" fill="#94A3B8" font-size="15" font-weight="800">PR-AUC</text>
      <text x="70" y="82" fill="#F8FAFC" font-size="36" font-weight="900">0.93</text>
    </g>
    <g transform="translate(966 0)">
      <rect width="292" height="118" rx="24" fill="url(#card)" stroke="#334155"/>
      <circle cx="38" cy="44" r="18" fill="#F97316" opacity="0.22"/><circle cx="38" cy="44" r="7" fill="#F97316"/>
      <text x="70" y="43" fill="#94A3B8" font-size="15" font-weight="800">Median delay</text>
      <text x="70" y="82" fill="#F8FAFC" font-size="36" font-weight="900">3.2s</text>
    </g>
  </g>

  <g transform="translate(60 296)" font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect width="820" height="360" rx="28" fill="url(#card)" stroke="#334155"/>
    <text x="34" y="46" fill="#F8FAFC" font-size="25" font-weight="900">Anomaly score over time</text>
    <text x="34" y="75" fill="#94A3B8" font-size="15">threshold selected from normal validation scores; test labels are held out</text>

    <g transform="translate(52 108)">
      <line x1="0" y1="200" x2="720" y2="200" stroke="#334155"/>
      <line x1="0" y1="150" x2="720" y2="150" stroke="#1E293B"/>
      <line x1="0" y1="100" x2="720" y2="100" stroke="#1E293B"/>
      <line x1="0" y1="50" x2="720" y2="50" stroke="#1E293B"/>
      <line x1="0" y1="78" x2="720" y2="78" stroke="#F97316" stroke-width="3" stroke-dasharray="10 10"/>
      <text x="620" y="64" fill="#FDBA74" font-size="14" font-weight="800">threshold</text>
      <path d="M0 174 C30 162 55 182 88 162 C123 142 150 176 186 158 C222 137 255 164 292 146 C330 126 356 154 390 138 C430 118 464 146 500 108 C526 78 550 102 575 70 C601 37 636 90 666 58 C692 30 705 72 720 48" stroke="url(#score)" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M0 192 C64 188 115 195 178 181 C240 166 302 180 368 156 C445 126 512 140 574 115 C636 88 680 92 720 80" stroke="#10B981" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.88"/>
      <circle cx="575" cy="70" r="12" fill="#F97316"/><circle cx="575" cy="70" r="26" fill="#F97316" opacity="0.14"/>
      <circle cx="666" cy="58" r="12" fill="#F97316"/><circle cx="666" cy="58" r="26" fill="#F97316" opacity="0.14"/>
    </g>
  </g>

  <g transform="translate(920 296)" font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect width="420" height="360" rx="28" fill="url(#card)" stroke="#334155"/>
    <text x="30" y="46" fill="#F8FAFC" font-size="25" font-weight="900">Host risk ranking</text>
    <text x="30" y="75" fill="#94A3B8" font-size="15">highest anomaly contribution by host window</text>
    <g transform="translate(30 112)">
      <text x="0" y="0" fill="#CBD5E1" font-size="15" font-weight="800">host-07</text><rect x="0" y="16" width="338" height="16" rx="8" fill="#1E293B"/><rect x="0" y="16" width="302" height="16" rx="8" fill="#F97316"/>
      <text x="0" y="68" fill="#CBD5E1" font-size="15" font-weight="800">host-12</text><rect x="0" y="84" width="338" height="16" rx="8" fill="#1E293B"/><rect x="0" y="84" width="248" height="16" rx="8" fill="#8B5CF6"/>
      <text x="0" y="136" fill="#CBD5E1" font-size="15" font-weight="800">host-03</text><rect x="0" y="152" width="338" height="16" rx="8" fill="#1E293B"/><rect x="0" y="152" width="198" height="16" rx="8" fill="#38BDF8"/>
      <text x="0" y="204" fill="#CBD5E1" font-size="15" font-weight="800">host-21</text><rect x="0" y="220" width="338" height="16" rx="8" fill="#1E293B"/><rect x="0" y="220" width="156" height="16" rx="8" fill="#10B981"/>
    </g>
  </g>

  <g transform="translate(60 696)" font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect width="600" height="118" rx="26" fill="url(#card)" stroke="#334155"/>
    <text x="30" y="45" fill="#F8FAFC" font-size="23" font-weight="900">Detector comparison</text>
    <text x="30" y="78" fill="#94A3B8" font-size="15">Z-score · MAD · Isolation Forest · LSTM AE · Transformer AE · Graph-temporal AE</text>
    <rect x="450" y="34" width="112" height="42" rx="21" fill="#0F2F26" stroke="#10B981"/><text x="478" y="61" fill="#86EFAC" font-size="15" font-weight="900">auditable</text>
  </g>

  <g transform="translate(700 696)" font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect width="640" height="118" rx="26" fill="url(#card)" stroke="#334155"/>
    <text x="30" y="45" fill="#F8FAFC" font-size="23" font-weight="900">Alert review queue</text>
    <text x="30" y="78" fill="#94A3B8" font-size="15">ranked anomaly windows with score, host, detector family, and investigation status</text>
    <rect x="500" y="34" width="100" height="42" rx="21" fill="#331F15" stroke="#F97316"/><text x="527" y="61" fill="#FDBA74" font-size="15" font-weight="900">triage</text>
  </g>
</svg>
