    <path d="M440 48V314" stroke="#334155"/>
    <path d="M580 48V314" stroke="#334155"/>
    <path d="M720 48V314" stroke="#334155"/>
    <path d="M860 48V314" stroke="#334155"/>
    <path d="M1000 48V314" stroke="#334155"/>
  </g>

  <g filter="url(#glow)">
    <path d="M115 248C165 232 192 202 238 211C286 221 301 170 344 165C400 158 430 240 483 224C524 211 539 154 584 146C641 136 674 221 730 210C775 201 792 152 835 143C896 130 919 220 978 211C1028 203 1053 157 1090 149" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="584" cy="146" r="9" fill="#F97316"/>
    <circle cx="835" cy="143" r="9" fill="#F97316"/>
    <circle cx="978" cy="211" r="7" fill="#38BDF8"/>
  </g>

  <g opacity="0.95">
    <line x1="765" y1="96" x2="835" y2="143" stroke="#475569" stroke-width="2"/>
    <line x1="835" y1="143" x2="920" y2="104" stroke="#475569" stroke-width="2"/>
    <line x1="835" y1="143" x2="884" y2="222" stroke="#475569" stroke-width="2"/>
    <line x1="884" y1="222" x2="978" y2="211" stroke="#475569" stroke-width="2"/>
