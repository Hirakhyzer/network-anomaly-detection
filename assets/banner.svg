  <text x="120" y="123" fill="#E0F2FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">CYBERSECURITY + ML</text>
  <text x="120" y="169" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800">Network Anomaly</text>
