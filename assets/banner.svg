<svg width="1400" height="460" viewBox="0 0 1400 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Trustworthy Network Anomaly Detection Lab banner</title>
  <desc id="desc">Professional dark academic banner showing telemetry, anomaly scoring, and trustworthy network anomaly detection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1400" height="460" rx="34" fill="url(#bg)"/>
  <circle cx="1180" cy="92" r="230" fill="#38BDF8" opacity="0.08"/>
  <circle cx="1320" cy="390" r="210" fill="#8B5CF6" opacity="0.08"/>
  <path d="M0 390 C180 330 320 430 520 370 C740 306 900 362 1080 314 C1210 279 1302 289 1400 250 V460 H0 Z" fill="#0EA5E9" opacity="0.05"/>

  <g transform="translate(72 74)">
    <rect x="0" y="0" width="720" height="312" rx="30" fill="#0B1220" stroke="#243244" stroke-width="1.5" filter="url(#soft)"/>
    <rect x="38" y="36" width="268" height="38" rx="19" fill="#0F2A3E" stroke="#155E75"/>
    <text x="58" y="61" fill="#7DD3FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="1.8">RESEARCH-GRADE CYBERSECURITY ML</text>

    <text x="38" y="126" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="45" font-weight="900">Trustworthy Network</text>
    <text x="38" y="178" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="45" font-weight="900">Anomaly Detection Lab</text>
    <text x="40" y="222" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Leakage-aware evaluation · transparent baselines · deep sequence models · graph-temporal learning</text>

    <g transform="translate(38 256)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">
      <rect width="148" height="38" rx="19" fill="#102A43" stroke="#38BDF8"/><text x="22" y="25" fill="#BAE6FD">Telemetry</text>
      <rect x="166" width="150" height="38" rx="19" fill="#2A174E" stroke="#8B5CF6"/><text x="187" y="25" fill="#DDD6FE">Detectors</text>
      <rect x="334" width="150" height="38" rx="19" fill="#0F2F26" stroke="#10B981"/><text x="355" y="25" fill="#BBF7D0">Evaluation</text>
      <rect x="502" width="150" height="38" rx="19" fill="#331F15" stroke="#F97316"/><text x="523" y="25" fill="#FED7AA">Alerts</text>
    </g>
  </g>

  <g transform="translate(850 72)" filter="url(#soft)">
    <rect x="0" y="0" width="470" height="316" rx="30" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
    <text x="34" y="48" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="900">Anomaly score stream</text>
    <text x="34" y="76" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">synthetic multi-host telemetry · held-out test period</text>

    <g transform="translate(34 104)">
      <line x1="0" y1="150" x2="400" y2="150" stroke="#334155"/>
      <line x1="0" y1="95" x2="400" y2="95" stroke="#1E293B"/>
      <line x1="0" y1="40" x2="400" y2="40" stroke="#1E293B"/>
      <path d="M0 126 C28 112 48 121 72 111 C95 101 116 128 142 112 C168 96 190 118 212 108 C236 97 260 124 282 105 C306 82 330 108 352 88 C374 69 386 94 400 82" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M0 144 C44 138 82 146 122 136 C170 123 214 140 258 126 C312 109 354 118 400 102" stroke="#10B981" stroke-width="4" opacity="0.9" stroke-linecap="round" fill="none"/>
      <line x1="0" y1="58" x2="400" y2="58" stroke="#F97316" stroke-width="3" stroke-dasharray="8 9"/>
      <circle cx="351" cy="88" r="12" fill="#F97316"/>
      <circle cx="351" cy="88" r="24" fill="#F97316" opacity="0.15"/>
      <text x="312" y="28" fill="#FDBA74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800">alert</text>
    </g>

    <g transform="translate(34 274)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect width="118" height="24" rx="12" fill="#0F2A3E"/><text x="16" y="17" fill="#7DD3FC" font-size="12" font-weight="800">PR-AUC</text>
      <rect x="138" width="118" height="24" rx="12" fill="#0F2F26"/><text x="154" y="17" fill="#86EFAC" font-size="12" font-weight="800">F1</text>
      <rect x="276" width="124" height="24" rx="12" fill="#331F15"/><text x="292" y="17" fill="#FDBA74" font-size="12" font-weight="800">Delay</text>
